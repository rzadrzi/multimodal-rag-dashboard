services:
  app:
    build:
      context: app
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app
      - static_volume:/app/staticfiles
    restart: always
    container_name: filemanager_app
    env_file:
      - .env

  celery:
    build:
      context: app
      dockerfile: Dockerfile
    container_name: filemanager_celery
    command: celery -A worker.celery_app worker --loglevel=info
    volumes:
      - ./app:/app
    restart: always
    env_file:
      - .env
    depends_on:
      - app
      - redis

  redis:
    image: redis:7
    container_name: redis
    restart: always
    ports:
      - "6379:6379"

  nginx:
    #    image: nginx:alpine
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
    volumes:
      - static_volume:/static:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app

